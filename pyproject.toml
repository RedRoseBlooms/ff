[project]
name = "discord-economy-bot"
version = "1.0.0"
description = "Production-ready Discord economy and casino bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "discord.py>=2.4.0",
    "asyncpg>=0.30.0",
    "aiohttp>=3.11.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "alembic>=1.14.0",
    "sqlalchemy[asyncio]>=2.0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
